<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عملیات موفق</title>
    <style>
        body {
            font-family: "Vazir", Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .message {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .redirect {
            margin-top: 20px;
            font-size: 18px;
        }
        .redirect a {
            color: #27ae60;
            text-decoration: none;
            font-weight: bold;
        }
        .redirect a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>عملیات موفق</h1>
    <div class="message">
        جستجوی شما با موفقیت ذخیره شد.
    </div>
    <div class="redirect">
        <p>به صفحه جستجو برگردید: <a href="/sbert">برگشت به صفحه جستجو</a></p>
    </div>
</body>
</html>
